html:not([data-theme="classic"]) #scope-key.active{background:var(--key);color:var(--gold)}
html:not([data-theme="classic"]) .group-title:before{background:var(--blue)}
html:not([data-theme="classic"]) .chronicle-table tr.selected,html:not([data-theme="classic"]) .chronicle-table tr.selected:hover{background:var(--blue-soft);box-shadow:inset 3px 0 var(--blue)}
html:not([data-theme="classic"]) .chronicle-card.selected{background:var(--blue-soft);border-color:var(--blue)}
html:not([data-theme="classic"]) .chronicle-card.key-row{border-left-color:var(--gold)}
html:not([data-theme="classic"]) .key-mark:before{background:var(--gold)}
html:not([data-theme="classic"]) .detail .quote{border-left-color:var(--tone)}
html:not([data-theme="classic"]) .detail .eyebrow{color:var(--tone)}
}
@media(max-width:1100px){.topbar{flex-wrap:wrap}.topbar-tools{flex:1 1 470px}}
@media(max-width:760px){.topbar-tools{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;flex-basis:100%;width:100%}.topbar-tools .search{min-width:0;width:100%}.theme-control{justify-content:flex-end}.theme-control select{width:160px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">律构<small>案件事实工作台</small></div><div class="nav-label">工作区</div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><span></span>本地工作底稿<br>事实整理 · 来源回查</div></aside><main class="main"><header class="topbar"><span class="breadcrumb">案件工作台 <span id="current-label">/ 概览</span></span><div class="topbar-tools"><label class="search"><input id="search" type="search" placeholder="搜索事实、主体、编号或原话" aria-label="搜索底稿"></label><label class="theme-control"><span>配色</span><select id="theme-picker" aria-label="配色主题"><option value="muted">沉稳多色</option><option value="bright">明快彩色</option><option value="classic">现有灰金</option></select></label></div></header><div class="heading"><div><div class="eyebrow">案件事实 · 工作底稿 <span id="demo-label"></span></div><h1 id="case-name"></h1><div class="subtitle" id="case-meta"></div></div><div class="actions"><button class="btn" id="print-all">打印全量</button><button class="btn" id="print-current">打印筛选结果</button></div></div><section class="view" id="overview" data-tone="blue"></section><section class="view" id="facts" data-tone="blue"><div class="chronicle-tools"><div class="chronicle-toolbar"><div class="segment" aria-label="事项范围"><button data-scope="all" id="scope-all">全部事项</button><button data-scope="key" id="scope-key">已选重点</button></div><div class="segment" aria-label="浏览顺序"><button data-layout="time" id="layout-time">按时间</button><button data-layout="group" id="layout-group">按整理分组</button></div></div><div class="filter-bar"><div class="filters" id="filters"></div></div><details class="advanced"><summary>更多筛选</summary><div class="filters" id="advanced-filters"></div></details></div><div class="result-line"><span id="result-count"></span><button class="table-row-btn" id="reset">重置筛选</button></div><div class="workspace"><div class="list-panel" id="fact-list"></div><aside class="detail" id="fact-detail" data-tone="blue" aria-label="大事记详情"></aside></div></section><section class="view" id="materials" data-tone="green"></section><section class="view" id="subjects" data-tone="purple"></section><section class="view" id="amounts" data-tone="gold"></section><section class="view" id="issues" data-tone="red"></section><section class="view" id="changes" data-tone="neutral"></section><aside class="detail" id="entity-detail" hidden></aside><div class="section-note" id="scope"></div></main></div><div class="mobile-overlay" id="mobile-detail"></div><div class="print-root" id="print-root"></div>
<script id="case-data" type="application/json">__CASE_DATA__</script><script>
'use strict';
const THEME_IDS=['muted','bright','classic'],THEME_KEY='lugou.workpaper.theme';
function applyTheme(value,persist=false){const theme=THEME_IDS.includes(value)?value:'muted';document.documentElement.dataset.theme=theme;document.getElementById('theme-picker').value=theme;if(persist){try{window.localStorage.setItem(THEME_KEY,theme)}catch{}}return theme;}
let savedTheme='muted';try{savedTheme=window.localStorage.getItem(THEME_KEY)||'muted'}catch{}applyTheme(savedTheme);
document.getElementById('theme-picker').addEventListener('change',e=>applyTheme(e.target.value,true));
const viewTone={overview:'blue',facts:'blue',materials:'green',subjects:'purple',amounts:'gold',issues:'red',changes:'neutral'};
const amountTone=role=>['协议总额','协议分项'].includes(role)?'blue':['流水发生额','回款记载'].includes(role)?'green':['一方主张','主张拆项'].includes(role)?'purple':'gold';
const STATUS_TONES=Object.assign(Object.create(null),{'未复核':'neutral','已核对原件':'verified','需补核':'gold','存在异议':'red','已提取':'green','部分提取':'gold','无法读取':'red','待补核':'gold','已收到待核':'blue','已核实关闭':'verified','冲突':'red','缺口':'gold','识别疑点':'gold','待确认变更':'gold'});
const statusTone=value=>STATUS_TONES[value]||'neutral';
const entityTone=id=>id.startsWith('M')?'green':id.startsWith('S')?'purple':id.startsWith('Q')?'red':'blue';

const D=JSON.parse(document.getElementById('case-data').textContent),M=Object.fromEntries(D.materials.map(x=>[x.id,x])),S=Object.fromEntries(D.subjects.map(x=>[x.id,x])),R=Object.fromEntries(D.citations.map(x=>[x.id,x])),F=Object.fromEntries(D.facts.map(x=>[x.id,x])),Q=Object.fromEntries(D.issues.map(x=>[x.id,x]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(a,c='CNY')=>a==null?'—':Number(a).toLocaleString('zh-CN',{maximumFractionDigits:2})+(c==='CNY'?' 元':' '+c);
const humanMoney=a=>a==null?'—':(Math.abs(a)>=10000?(a/10000).toLocaleString('zh-CN',{maximumFractionDigits:2})+' 万元':money(a));
const text=f=>f.manual?.description??f.description,amt=f=>f.manual?.amount??f.amount;
const state={view:'facts',query:'',subject:'',material:'',category:'',batch:'',kind:'',review:'',group:'',scope:'all',layout:'time',selected:null,printAll:true};
const navs=[['overview','案件概览',''],['facts','大事记',D.facts.length],['materials','材料',D.materials.length],['subjects','主体',D.subjects.length],['amounts','金额',''],['issues','待核',D.issues.filter(q=>q.progress!=='已核实关闭').length],['changes','更新',D.changes.length]];
const ref=(id,label=id)=>`<button class="ref" data-open="${esc(id)}">${esc(label)}</button>`;
const refs=ids=>`<div class="refs">${(ids||[]).map(id=>ref(id)).join('')}</div>`;
const badge=s=>`<span data-tone="${statusTone(s)}" class="pill ${['需补核','存在异议','冲突','缺口','识别疑点','待确认变更'].includes(s)?'warn':''}">${esc(s)}</span>`;
const citation=id=>{const r=R[id];if(!r)return '';const loc=r.locator||{};return `<div class="citation" id="quote-${esc(id)}"><div class="muted">${ref(id)} ${ref(r.material_id,M[r.material_id]?.filename||r.material_id)}</div><div class="quote">${esc(r.quote)}</div><small>${esc(r.location)} · ${esc(r.verification)}</small>${r.source_href?`<a href="${esc(r.source_href)}" target="_blank" rel="noopener">查看原件</a>`:'<small>原件缺失或已变更，须补提供</small>'}${r.audio_href?`<audio controls preload="metadata" src="${esc(r.audio_href)}#t=${loc.start||0},${loc.end||''}"></audio><button class="ref" data-play="${esc(id)}">定位 ${Number(loc.start||0).toFixed(1)} 秒</button>`:''}</div>`};
const issueRelated=(q,f)=>(q.fact_ids||[]).includes(f.id)||(q.citation_ids||[]).some(id=>f.citation_ids.includes(id))||(!(q.fact_ids||[]).length&&(q.material_ids||[]).some(mid=>f.citation_ids.some(id=>R[id]?.material_id===mid)));
const line=(key,value)=>`<div class="data-line"><span class="key">${esc(key)}</span><span class="value">${value}</span></div>`;
function factHTML(f){return `<div class="detail-title"><div><div class="eyebrow">${esc(f.id)} · ${esc(f.kind)}</div><h2>${esc(text(f))}</h2></div><button class="close" data-close aria-label="关闭详情">×</button></div>${line('原始时间',esc(f.date.raw))}${f.manual?.date_raw?line('人工时间',esc(f.manual.date_raw)):''}${line('涉及主体',(f.subject_ids||[]).map(id=>ref(id,S[id]?.name||id)).join(' '))}${f.amount!=null?line('材料金额',esc(money(f.amount,f.currency))):''}${f.manual?.amount!=null?line('人工金额',esc(money(f.manual.amount,f.manual.currency||f.currency))):''}${f.amount_role?line('金额角色',esc(f.amount_role)):''}${f.transaction_id?line('交易编号',esc(f.transaction_id)):''}${f.agreement_round?line('协议轮次',esc(f.agreement_round)):''}${line('整理分组',esc(f.manual?.chronicle_group?.trim()||'未分组'))}${line('重点选择',f.manual?.is_key===true?'人工选为重点':f.manual?.is_key===false?'人工选择：否':'尚未选择')}${line('复核状态',badge(f.review_status||'未复核'))}<p class="muted">分组与重点仅为人工整理选择；原件核对情况以复核状态为准。</p>${f.reviewed_by?line('复核记录',esc(f.reviewed_by+' '+(f.reviewed_at||''))):''}<div class="detail-section"><h3>连续原话与准确出处</h3>${(f.citation_ids||[]).map(citation).join('')}</div><div class="detail-section"><h3>人工备注</h3><div class="review-note">${esc(f.review_note||'尚未填写复核备注')}</div>${f.manual?.description!=null?`<p class="muted">原始摘要：${esc(f.description)}</p>`:''}${refs(f.checked_citation_ids||[])}</div><div class="detail-section"><h3>关联待核事项</h3>${D.issues.filter(q=>issueRelated(q,f)).map(q=>`<div class="issue-row">${ref(q.id,q.title)} ${badge(q.progress||'待补核')}</div>`).join('')||'<p class="muted">未列出关联问题</p>'}</div>`}
const orderedFacts=[...D.facts].sort((a,b)=>(a.date.iso||'9999').localeCompare(b.date.iso||'9999')||a.id.localeCompare(b.id));
const searchIndex=Object.fromEntries(D.facts.map(f=>[f.id,[f.id,f.description,f.manual?.description,f.date.raw,f.manual?.date_raw,f.manual?.chronicle_group,f.review_note,f.amount,f.amount==null?'':f.amount/10000,f.manual?.amount,f.manual?.amount==null?'':f.manual.amount/10000,f.currency,f.manual?.currency,f.transaction_id,f.agreement_round,f.amount_role,...(f.subject_ids||[]).flatMap(id=>[id,S[id]?.name,...(S[id]?.aliases||[])]),...(f.citation_ids||[]).flatMap(id=>[id,R[id]?.quote,R[id]?.filename,R[id]?.material_id])].join(' ').toLowerCase()]));
const groupName=f=>f.manual?.chronicle_group?.trim()||'';
const groupOrder=[...new Set(orderedFacts.map(groupName).filter(Boolean))];
function groupedFacts(records,layout=state.layout){const section=rows=>[{label:'',rows:rows.filter(f=>f.date.iso)},{label:'日期未明确 / 区间待定位',rows:rows.filter(f=>!f.date.iso)}].filter(x=>x.rows.length);if(layout==='time')return [{label:'时间顺序',rows:records,sections:section(records)}];return [...groupOrder,''].map(g=>{const rows=records.filter(f=>groupName(f)===g);return {label:g||'未分组',rows,sections:section(rows)}}).filter(g=>g.rows.length);}
const sourceBrief=f=>{const mids=[...new Set(f.citation_ids.map(id=>R[id]?.material_id).filter(Boolean))];return mids.slice(0,2).map(id=>ref(id)).join(' ')+(mids.length>2?` <span class="muted">等 ${mids.length} 份</span>`:'')+`<div class="muted">${f.citation_ids.length} 处引用</div>`};
const keyMark=f=>f.manual?.is_key===true?'<span class="key-mark">人工重点</span>':'';
function filtered(){const q=state.query.trim().toLowerCase();return orderedFacts.filter(f=>(state.scope!=='key'||f.manual?.is_key===true)&&(!q||searchIndex[f.id].includes(q))&&(!state.group||(state.group==='__ungrouped__'?!groupName(f):groupName(f)===state.group.slice(2)))&&(!state.subject||(f.subject_ids||[]).includes(state.subject))&&(!state.kind||f.kind===state.kind)&&(!state.review||(f.review_status||'未复核')===state.review)&&(!state.material||f.citation_ids.some(id=>R[id]?.material_id===state.material))&&(!state.category||f.citation_ids.some(id=>M[R[id]?.material_id]?.category===state.category))&&(!state.batch||f.citation_ids.some(id=>M[R[id]?.material_id]?.batch_id===state.batch)));}
function closeDetails(){state.selected=null;document.getElementById('mobile-detail').classList.remove('open');document.body.style.overflow='';document.getElementById('entity-detail').hidden=true;renderFacts();}
function showFact(id){if(!F[id])return;state.selected=id;renderFacts();if(!state.selected)return;if(matchMedia('(max-width:760px)').matches){const o=document.getElementById('mobile-detail');o.innerHTML=`<div class="detail" data-tone="blue">${factHTML(F[id])}</div>`;o.classList.add('open');document.body.style.overflow='hidden'}}
function renderFacts(){const fs=filtered();if(state.selected&&!fs.some(f=>f.id===state.selected)){state.selected=null;document.getElementById('mobile-detail').classList.remove('open');document.body.style.overflow='';}const groups=groupedFacts(fs);document.getElementById('result-count').textContent=`${fs.length} 条事项 / 全案 ${D.facts.length} 条${state.layout==='group'?' · '+groups.length+' 个整理分组':''}`;for(const k of ['all','key']){const b=document.getElementById('scope-'+k);b.classList.toggle('active',state.scope===k);b.setAttribute('aria-pressed',String(state.scope===k));b.textContent=(k==='all'?'全部事项 '+D.facts.length:'已选重点 '+D.facts.filter(f=>f.manual?.is_key===true).length);}for(const k of ['time','group']){const b=document.getElementById('layout-'+k);b.classList.toggle('active',state.layout===k);b.setAttribute('aria-pressed',String(state.layout===k));}
const row=f=>`<tr tabindex="0" role="button" aria-label="查看 ${esc(f.id)} 详情" data-fact="${f.id}" class="${f.id===state.selected?'selected ':''}${f.manual?.is_key===true?'key-row':''}"><td><span class="chronicle-date">${esc(f.manual?.date_raw||f.date.raw)}</span><div class="chronicle-id">${f.id}</div></td><td><div class="chronicle-summary">${esc(text(f))}</div>${keyMark(f)}</td><td><div class="chronicle-subjects">${(f.subject_ids||[]).map(id=>ref(id,S[id]?.name||id)).join('、')}</div></td><td class="chronicle-money">${esc(money(amt(f),f.manual?.currency||f.currency))}${f.manual?.amount!=null?'<div class="muted">人工更正</div>':''}</td><td>${sourceBrief(f)}</td><td>${badge(f.review_status||'未复核')}</td></tr>`;
const card=f=>`<article tabindex="0" role="button" aria-label="查看 ${esc(f.id)} 详情" data-fact="${f.id}" class="chronicle-card ${f.id===state.selected?'selected ':''}${f.manual?.is_key===true?'key-row':''}"><div class="chronicle-card-head"><span>${esc(f.manual?.date_raw||f.date.raw)}</span><span class="muted">${f.id}</span></div><div class="chronicle-summary">${esc(text(f))}</div>${keyMark(f)}<div class="fact-meta">${amt(f)!=null?`<b>${esc(money(amt(f),f.manual?.currency||f.currency))}</b>`:''}${badge(f.review_status||'未复核')}</div><div class="muted">${esc((f.subject_ids||[]).map(id=>S[id]?.name||id).join('、'))}</div><div class="source-brief">${sourceBrief(f)}</div></article>`;
document.getElementById('fact-list').innerHTML=groups.map(g=>`<div class="group-block">${state.layout==='group'?`<h2 class="group-title">${esc(g.label)} <span>${g.rows.length} 条</span></h2>`:''}<div class="chronicle-wrap"><table class="chronicle-table"><colgroup><col style="width:16%"><col style="width:31%"><col style="width:16%"><col style="width:13%"><col style="width:10%"><col style="width:14%"></colgroup><thead><tr><th>时间与编号</th><th>事项摘要</th><th>主体</th><th>金额</th><th>来源</th><th>复核状态</th></tr></thead><tbody>${g.sections.map(part=>(part.label?`<tr class="date-divider"><td colspan="6">${esc(part.label)} · ${part.rows.length} 条</td></tr>`:'')+part.rows.map(row).join('')).join('')}</tbody></table></div><div class="chronicle-mobile">${g.sections.map(part=>(part.label?`<h3 class="muted">${esc(part.label)} · ${part.rows.length} 条</h3>`:'')+part.rows.map(card).join('')).join('')}</div></div>`).join('')||'<div class="empty-message">没有匹配事项，请调整关键词或筛选条件</div>';
const panel=document.getElementById('fact-detail');panel.className='detail'+(state.selected?' open':'');panel.innerHTML=state.selected?factHTML(F[state.selected]):'';}

function overview(){const sums=D.case.amount_summaries||[],keys=orderedFacts.filter(f=>f.manual?.is_key===true);const covered=D.materials.filter(m=>m.state==='已提取').length,read=D.materials.flatMap(m=>m.units||[]).filter(u=>u.reading?.status==='已读').length,units=D.materials.flatMap(m=>m.units||[]).length;document.getElementById('overview').innerHTML=`<div class="cards">${sums.slice(0,3).map(a=>`<div class="card amount-card" data-tone="${amountTone(a.role)}"><div class="label">${esc(a.label)}</div><div class="metric">${Number(a.amount/10000).toLocaleString('zh-CN',{maximumFractionDigits:2})}<small>万元</small></div><div class="note">${esc(a.party||a.role||'')} ${esc(a.version||'')}<br>${esc(a.detail||'')}</div>${refs(a.citation_ids)}</div>`).join('')||'<div class="card">尚未设置有来源的金额摘要</div>'}</div><div class="coverage"><span data-tone="green"><strong>${D.materials.length}</strong>份材料</span><span data-tone="green"><strong>${covered}</strong>完整提取</span><span data-tone="blue"><strong>${read}/${units}</strong>单元已读</span><span data-tone="verified"><strong>${D.facts.filter(f=>f.review_status==='已核对原件').length}</strong>事实核过原件</span><span data-tone="gold"><strong>${D.issues.filter(q=>q.progress!=='已核实关闭').length}</strong>待核问题</span></div>${D.case.demo_manual_note?`<p class="section-note">${esc(D.case.demo_manual_note)}</p>`:''}<div class="overview-grid"><div class="panel" data-tone="gold"><h2>已选重点 <span class="muted">${keys.length} 条</span></h2>${keys.length?keys.map(f=>`<div class="mini-event"><button class="mini-row" data-open="${f.id}"><time>${esc(f.date.raw)}</time><span>${esc(text(f))}</span><span class="arrow">↗</span></button>${refs(f.citation_ids)}</div>`).join(''):'<div class="empty-key">尚未人工选择重点。<p>在 Excel“重点事项”列填写“是”，回导后重新生成。</p><button class="ref" data-view="facts">进入大事记</button></div>'}</div><div class="panel" data-tone="red"><h2>待核入口</h2>${D.issues.filter(q=>q.progress!=='已核实关闭').slice(0,6).map(q=>`<div class="issue-row"><button data-open="${q.id}">${esc(q.title)}</button><small>${esc(q.id+' · '+q.kind)}</small></div>`).join('')||'<p class="muted">尚未列出待核事项</p>'}</div></div>`}
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${heads.length}" class="empty-message">没有匹配记录</td></tr>`}</tbody></table></div>`;
function renderSections(){const q=state.query.toLowerCase();document.getElementById('materials').innerHTML=`<h2>材料目录</h2><p class="section-note">提取状态表示读取覆盖；原件核对情况记录在事实中。</p>`+table(['编号 / 材料','类别 · 批次','提取状态','关系 / 缺口'],D.materials.filter(m=>[m.id,m.filename,m.category,m.batch_id,...(m.notes||[])].join(' ').toLowerCase().includes(q)).map(m=>`<tr><td>${ref(m.id,m.id+' '+m.filename)}</td><td>${esc(m.category||'未分类')}<br><span class="muted">${esc(m.batch_id||'未标批次')} · ${esc(m.document_form||'形态待核')}</span></td><td>${badge(m.state)}<br><span class="muted">${(m.units||[]).length} 个提取单元</span></td><td>${m.duplicate_of?ref(m.duplicate_of,'重复 '+m.duplicate_of):''}${m.version_of?ref(m.version_of,'前版 '+m.version_of):''}<span class="muted">${esc((m.notes||[]).join('；'))}</span></td></tr>`));document.getElementById('subjects').innerHTML='<h2>主体与原始称谓</h2>'+table(['编号 / 称谓','材料中角色','别称','身份边界'],D.subjects.filter(s=>[s.id,s.name,s.role,...(s.aliases||[])].join(' ').toLowerCase().includes(q)).map(s=>`<tr><td>${ref(s.id,s.id+' '+s.name)}</td><td>${esc(s.role)}</td><td>${esc((s.aliases||[]).join('、'))}</td><td>${esc(s.identity_note||'身份关联仍须有来源支持')}</td></tr>`));document.getElementById('issues').innerHTML='<h2>冲突与待核</h2>'+table(['编号 / 问题','类型','办理状态','下一步'],D.issues.filter(x=>[x.id,x.title,x.detail,x.next_step].join(' ').toLowerCase().includes(q)).map(x=>`<tr><td>${ref(x.id,x.id+' '+x.title)}</td><td>${badge(x.kind)}</td><td>${badge(x.progress||'待补核')}</td><td>${esc(x.next_step)}</td></tr>`));document.getElementById('changes').innerHTML='<h2>更新记录</h2>'+table(['时间','变更类型','关联对象','内容'],D.changes.filter(c=>[c.type,c.detail,c.target_id].join(' ').toLowerCase().includes(q)).map(c=>`<tr><td>${esc(c.at.replace('T',' '))}</td><td>${esc(c.type)}</td><td>${c.target_id?ref(c.target_id):''}</td><td>${esc(c.detail)}</td></tr>`));renderAmounts();}
function amountGroups(){const groups={};for(const f of D.facts.filter(f=>f.amount!=null)){const role=f.amount_role||'未标金额角色',key=role+'|'+(f.transaction_id||f.id);(groups[key]??={role,transaction:f.transaction_id||'',facts:[]}).facts.push(f)}return Object.values(groups).map(g=>({...g,amounts:[...new Set(g.facts.map(f=>f.amount))]}));}
function renderAmounts(){document.getElementById('amounts').innerHTML=`<h2>金额核对</h2><p class="section-note">按材料口径分别列示。相同角色且交易编号相同的引用并列；交易不明不合并。人工更正见事实详情。</p><div class="amount-grid">${(D.case.amount_summaries||[]).map(a=>`<div class="card amount-card" data-tone="${amountTone(a.role)}"><div class="label">${esc(a.label)}</div><div class="metric">${esc(humanMoney(a.amount))}</div><div class="note">${esc(a.party||'')} ${esc(a.version||'')}<br>${esc(a.detail||'')}</div>${refs(a.fact_ids)}${refs(a.citation_ids)}</div>`).join('')}</div>`+table(['金额角色','交易编号 / 事实','原始金额','记载方 / 材料版本','关联记录'],amountGroups().filter(g=>[g.role,g.transaction,...g.facts.map(f=>searchIndex[f.id])].join(' ').includes(state.query.toLowerCase())).map(g=>`<tr><td>${esc(g.role)}</td><td>${esc(g.transaction||'编号未明，分别保留')}</td><td>${g.amounts.map(a=>esc(money(a))).join('<br>')}${g.amounts.length>1?' '+badge('存在异议'):''}</td><td>${esc([...new Set(g.facts.flatMap(f=>(f.subject_ids||[]).map(id=>S[id]?.name||id)))].join('、'))}<br><span class="muted">${esc([...new Set(g.facts.flatMap(f=>f.citation_ids.map(id=>R[id]?.filename||id)))].join('；'))}</span></td><td>${refs(g.facts.map(f=>f.id))}</td></tr>`));}
function entityHTML(id){if(M[id]){const m=M[id];return `<div class="detail-title"><h2>${esc(m.id+' '+m.filename)}</h2><button class="close" data-close>×</button></div>${line('读取状态',badge(m.state))}${line('类别 / 批次',esc((m.category||'未分类')+' / '+(m.batch_id||'未标定')))}${line('读取说明',esc((m.notes||[]).join('；')||'提取文字仍须按出处回原件'))}${m.source_href?`<a href="${esc(m.source_href)}" target="_blank" rel="noopener">查看原件</a>`:''}<div class="detail-section"><h3>关联待核事项</h3>${refs(D.issues.filter(q=>(q.material_ids||[]).includes(id)).map(q=>q.id))}</div><div class="detail-section"><h3>相关事实</h3>${refs(D.facts.filter(f=>f.citation_ids.some(r=>R[r]?.material_id===id)).map(f=>f.id))}</div><div class="detail-section"><h3>原话与出处</h3>${D.citations.filter(r=>r.material_id===id).map(r=>citation(r.id)).join('')||'<span class="muted">没有引用；请查看材料提取与阅读状态</span>'}</div>`}if(S[id]){const s=S[id];return `<div class="detail-title"><h2>${esc(s.name)}</h2><button class="close" data-close>×</button></div>${line('原始角色',esc(s.role))}${line('其它称谓',esc((s.aliases||[]).join('、')))}${line('身份边界',esc(s.identity_note))}<div class="detail-section"><h3>相关材料</h3>${refs(s.material_ids)}</div><div class="detail-section"><h3>相关事实</h3>${refs(D.facts.filter(f=>(f.subject_ids||[]).includes(id)).map(f=>f.id))}</div>`}if(Q[id]){const x=Q[id];return `<div class="detail-title"><div><div class="eyebrow">${x.id} · ${esc(x.kind)}</div><h2>${esc(x.title)}</h2></div><button class="close" data-close>×</button></div><div class="quote">${esc(x.detail)}</div>${line('办理状态',badge(x.progress||'待补核'))}${line('下一步',esc(x.next_step))}${line('核查结果',esc(x.resolution_note||'尚未记录'))}${line('复核备注',esc(x.review_note||'尚未填写'))}<div class="detail-section"><h3>相关事实与材料</h3>${refs(x.fact_ids)}${refs(x.material_ids)}${refs(x.received_material_ids)}</div><div class="detail-section"><h3>相关原话</h3>${(x.citation_ids||[]).map(citation).join('')}</div>`}if(R[id])return `<div class="detail-title"><h2>原文引用 ${esc(id)}</h2><button class="close" data-close aria-label="关闭详情">×</button></div>${citation(id)}${refs(D.facts.filter(f=>f.citation_ids.includes(id)).map(f=>f.id))}`;return '<p class="muted">未找到该关联对象</p>'}
function openEntity(id){if(F[id]){resetFilters();navigate('facts');showFact(id);return}if(M[id])navigate('materials');else if(S[id])navigate('subjects');else if(Q[id])navigate('issues');const html=entityHTML(id),e=document.getElementById('entity-detail');e.hidden=false;e.dataset.tone=entityTone(id);e.innerHTML=html;if(matchMedia('(max-width:760px)').matches){const o=document.getElementById('mobile-detail');o.innerHTML='<div class="detail" data-tone="'+entityTone(id)+'">'+html+'</div>';o.classList.add('open');document.body.style.overflow='hidden'}else e.scrollIntoView({block:'nearest',behavior:'smooth'});}
function navigate(view){if(view==='timeline')view='facts';state.view=navs.some(x=>x[0]===view)?view:'overview';document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===state.view));document.querySelectorAll('.nav a').forEach(e=>e.classList.toggle('active',e.dataset.view===state.view));document.getElementById('current-label').textContent='/ '+navs.find(x=>x[0]===state.view)[1];document.getElementById('entity-detail').hidden=true;history.replaceState(null,'','#'+state.view);}
function resetFilters(){for(const k of ['query','subject','material','category','batch','kind','review','group'])state[k]='';state.scope='all';document.getElementById('search').value='';document.querySelectorAll('#filters select, #advanced-filters select').forEach(e=>e.value='');renderFacts();renderSections();}
function makeFilters(){const select=(k,label,items)=>`<select data-filter="${k}" aria-label="${label}"><option value="">${label}</option>${items.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;document.getElementById('filters').innerHTML=select('subject','全部主体',D.subjects.map(s=>[s.id,s.name]))+select('review','复核状态',['未复核','已核对原件','需补核','存在异议'].map(x=>[x,x]))+select('group','整理分组',[...groupOrder.map(x=>['g:'+x,x]),['__ungrouped__','未分组']]);document.getElementById('advanced-filters').innerHTML=select('material','全部材料',D.materials.map(m=>[m.id,m.id+' '+m.filename]))+select('category','材料类别',[...new Set(D.materials.map(m=>m.category).filter(Boolean))].map(x=>[x,x]))+select('batch','材料批次',[...new Set(D.materials.map(m=>m.batch_id).filter(Boolean))].map(x=>[x,x]))+select('kind','记录类型',['材料记载','一方陈述','待核推断'].map(x=>[x,x]));}
function printFacts(all,invoke=true){state.printAll=all;const fs=all?orderedFacts:filtered(),groups=groupedFacts(fs),ids=new Set(fs.map(f=>f.id)),issues=D.issues.filter(q=>q.progress!=='已核实关闭'&&(all||fs.some(f=>issueRelated(q,f))));document.getElementById('print-root').innerHTML=`<h1>${esc(D.case.name)}${D.case.is_demo?'（虚构演示）':''}</h1><p class="print-meta">案件事实底稿 · ${esc(D.case.updated_at)} · ${fs.length} 条事项 · ${all?'全量':'当前筛选'} · ${state.layout==='group'?'按整理分组':'按时间'}</p><p>${esc(D.case.scope_note)}</p>${D.case.demo_manual_note?`<p>${esc(D.case.demo_manual_note)}</p>`:''}${all?(D.case.amount_summaries||[]).map(a=>`<p>${esc(a.label)}：${esc(money(a.amount))}；${esc(a.party||'')} ${esc(a.version||'')}；${esc(a.detail)}；来源 ${(a.citation_ids||[]).map(id=>esc(id+' '+R[id]?.filename+' '+R[id]?.location)).join('；')}</p>`).join(''):''}<h2>大事记与连续原话</h2>${groups.map(g=>`<section class="print-group">${state.layout==='group'?`<h2 class="group-title">${esc(g.label)} · ${g.rows.length} 条</h2>`:''}${g.sections.map(part=>(part.label?`<h3>${esc(part.label)} · ${part.rows.length} 条</h3>`:'')+part.rows.map(f=>`<article class="print-fact ${(f.citation_ids||[]).reduce((n,id)=>n+(R[id]?.quote.length||0),0)>1500?'long':''}"><h3>${f.id} · ${esc(f.date.raw)} · ${esc(text(f))}</h3><p>${esc(f.kind)}；${esc((f.subject_ids||[]).map(id=>S[id]?.name||id).join('、'))}；材料金额 ${esc(money(f.amount,f.currency))}${f.manual?.amount!=null?'；人工金额 '+esc(money(f.manual.amount,f.manual.currency||f.currency)):''}${f.manual?.date_raw?'；人工时间 '+esc(f.manual.date_raw):''}；${esc(f.review_status||'未复核')}；整理分组 ${esc(groupName(f)||'未分组')}；重点 ${f.manual?.is_key===true?'是':f.manual?.is_key===false?'否':'未选择'}</p>${f.manual?.description!=null?`<p>材料原始摘要：${esc(f.description)}</p>`:''}${f.review_note?`<p>人工备注：${esc(f.review_note)}</p>`:''}${f.reviewed_by?`<p>复核人：${esc(f.reviewed_by)} ${esc(f.reviewed_at||'')}；核查引用 ${esc((f.checked_citation_ids||[]).join('、'))}</p>`:''}${f.citation_ids.map(id=>{const r=R[id];return `<div class="quote">${esc(r.quote)}</div><small>${esc(id+' / '+r.material_id+' '+r.filename+' / '+r.location+' / '+r.verification)}</small>`}).join('')}</article>`).join('')).join('')}</section>`).join('')}<h2>关联未关闭问题</h2>${issues.map(q=>`<p class="print-issue">${esc(q.id+' '+q.title+'：'+q.detail+'；下一步 '+q.next_step)}</p>`).join('')||'<p>此范围没有关联未关闭问题</p>'}`;if(invoke)window.print();}
const navPaths={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',facts:'<path d="M5 4v16M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/>',materials:'<path d="M3 6h7l2 2h9v12H3zM3 6V4h7l2 2h8"/>',subjects:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M21 20v-2a5 5 0 0 0-4-5"/>',amounts:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',issues:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',changes:'<path d="M3 11a9 9 0 1 1 3 8M3 5v6h6M12 7v5l3 2"/>'};
document.getElementById('nav').innerHTML=navs.map(([id,name,count])=>`<a href="#${id}" data-view="${id}" data-tone="${viewTone[id]}"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">${navPaths[id]}</svg><span>${name}</span><em>${count}</em></a>`).join('');document.getElementById('case-name').textContent=D.case.name;document.getElementById('demo-label').textContent=D.case.is_demo?' · 虚构演示':'';document.getElementById('case-meta').textContent=`${D.case.revision?'底稿 v'+D.case.revision+' · ':''}${D.case.updated_at.replace('T',' ').slice(0,16)} · ${D.facts.length} 条事实`;document.getElementById('scope').textContent=D.case.scope_note;makeFilters();overview();renderFacts();renderSections();navigate(location.hash.slice(1)||'facts');
document.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-fact],[data-view],[data-close],[data-play],[data-scope],[data-layout]');if(!t)return;if(t.dataset.scope){state.scope=t.dataset.scope;renderFacts()}else if(t.dataset.layout){state.layout=t.dataset.layout;renderFacts()}else if(t.dataset.view){e.preventDefault();navigate(t.dataset.view)}else if(t.dataset.fact)showFact(t.dataset.fact);else if(t.dataset.open)openEntity(t.dataset.open);else if(t.hasAttribute('data-close'))closeDetails();else if(t.dataset.play){const r=R[t.dataset.play],a=t.parentElement.querySelector('audio');if(a){const seek=()=>{a.currentTime=r.locator?.start||0;a.play().catch(()=>{})};if(a.readyState>=1)seek();else{a.addEventListener('loadedmetadata',seek,{once:true});a.load()}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetails();return;}if(e.key==='Enter'||e.key===' '){const row=e.target.closest('[data-fact]');if(row&&e.target===row){e.preventDefault();showFact(row.dataset.fact)}}});
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;renderFacts();renderSections()});const filterChange=e=>{if(e.target.dataset.filter){state[e.target.dataset.filter]=e.target.value;renderFacts()}};document.getElementById('filters').addEventListener('change',filterChange);document.getElementById('advanced-filters').addEventListener('change',filterChange);document.getElementById('reset').addEventListener('click',resetFilters);document.getElementById('print-all').addEventListener('click',()=>printFacts(true));document.getElementById('print-current').addEventListener('click',()=>printFacts(false));window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));window.addEventListener('beforeprint',()=>printFacts(state.printAll,false));
