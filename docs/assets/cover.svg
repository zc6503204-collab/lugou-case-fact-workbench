<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">律构 · 案件事实工作台</title><desc id="desc">虚构案卷结构示意：协议6800万、银行汇入5600万、一方主张2680万，各自保留来源与复核状态。</desc><defs><style>text{font-family:"PingFang SC","Heiti SC",sans-serif}.serif{font-family:"Songti SC",serif}.muted{fill:#626d68}</style></defs><rect width="1280" height="720" fill="#f3f2ee"/><path d="M68 58h4v35h-4" fill="#86662a"/><text x="89" y="84" font-size="30" font-weight="600" fill="#252d2c" class="serif">律构</text><text x="192" y="84" font-size="17" class="muted">案件事实梳理 / v0.3</text><text x="68" y="183" font-size="50" class="serif" font-weight="600" fill="#252d2c">让每条事实，</text><text x="68" y="252" font-size="50" class="serif" font-weight="600" fill="#35618a">都有可回查的出处。</text><text x="70" y="312" font-size="21" class="muted">材料 · 大事记 · 原话 · 冲突 · 人工复核</text><path d="M70 350h450" stroke="#dbe1d6"/><text x="70" y="398" font-size="20" fill="#26776f">Excel 工作底稿 ＋ 离线网页</text><text x="70" y="438" font-size="19" class="muted">适配 Codex 与 WorkBuddy</text><text x="70" y="478" font-size="18" class="muted">稳定编号 / 增量更新 / 复核记录保护</text><rect x="600" y="130" width="610" height="450" rx="18" fill="#fff" stroke="#dfe4da"/><text x="632" y="173" font-size="19" fill="#252d2c">股权投资与回购 · 虚构演示</text><text x="632" y="205" font-size="16" class="muted">60份材料 / 118条事实 / 179条引用</text><path d="M632 225h546" stroke="#e1e5dc"/><rect x="632" y="245" width="174" height="110" rx="7" fill="#eff2f6"/><rect x="818" y="245" width="174" height="110" rx="7" fill="#eef4f3"/><rect x="1004" y="245" width="174" height="110" rx="7" fill="#f4f2f5"/><text x="651" y="278" font-size="17" fill="#35618a">协议约定</text><text x="651" y="326" font-size="31" fill="#35618a">6,800万</text><text x="837" y="278" font-size="17" fill="#26776f">银行汇入</text><text x="837" y="326" font-size="31" fill="#26776f">5,600万</text><text x="1023" y="278" font-size="17" fill="#746085">一方主张</text><text x="1023" y="326" font-size="31" fill="#746085">2,680万</text><text x="632" y="404" font-size="19" fill="#252d2c">200万元回款 · 性质分歧并列保留</text><text x="632" y="437" font-size="16" class="muted">不同说法与各自来源对应，不自动选择成立版本</text><rect x="632" y="466" width="546" height="80" rx="6" fill="#f7f7f2"/><path d="M633 466v80" stroke="#b4a176" stroke-width="3"/><text x="650" y="497" font-size="19" fill="#252d2c">“那50万后面统一处理”</text><text x="650" y="526" font-size="16" class="muted">保留原话与出处，未自动写成确认欠款</text><path d="M70 626h1140" stroke="#dbe1d6"/><text x="70" y="665" font-size="17" class="muted">公开演示均为虚构 · 界面结构示意 · 真实案件试用待验证</text><text x="1042" y="665" font-size="17" fill="#86662a">© 2026 律构</text></svg>